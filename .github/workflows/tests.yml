name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  team-workflow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core offline tests
        run: python -B tests/core/run_tests.py
      - name: Team workflow offline tests
        run: python -B -m unittest discover -s tests -p test_team_workflow.py -v
